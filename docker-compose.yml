services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blogdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__BlogDb: "Host=db;Port=5432;Database=blogdb;Username=blog;Password=blog"
    ports:
      - "5080:8080"
    volumes:
      - api-logs:/app/logs

volumes:
  pgdata:
  api-logs:
